{{define "content"}}
<section class="auth-card">
  <span class="auth-fox" aria-hidden="true">{{template "fox-peek" .}}</span>
  <h1>Create the admin account</h1>
  <p class="muted">The first account is the admin. This page closes once it exists; everyone else joins with an invite link.</p>
  {{with .Data.Error}}<p class="alert error" role="alert">{{.}}</p>{{end}}
  <form method="post" action="/setup" class="stack">
    <label for="setup-email">Email
      <input id="setup-email" type="email" name="email" value="{{.Data.Email}}" required autofocus autocomplete="username" inputmode="email" spellcheck="false">
    </label>
    <label for="setup-password">Password
      <input id="setup-password" type="password" name="password" minlength="10" maxlength="72" required autocomplete="new-password" aria-describedby="setup-password-help">
      <span class="help" id="setup-password-help">At least 10 characters.</span>
    </label>
    <label for="setup-password2">Confirm password
      <input id="setup-password2" type="password" name="password2" minlength="10" maxlength="72" required autocomplete="new-password">
    </label>
    <label for="setup-team">Team name
      <input id="setup-team" name="team" value="{{.Data.Team}}" placeholder="My team" maxlength="100" autocomplete="organization" aria-describedby="setup-team-help">
      <span class="help" id="setup-team-help">Projects belong to teams. Rename it or add more later.</span>
    </label>
    <button class="primary auth-submit" type="submit">Create account</button>
  </form>
</section>
{{end}}
