{{define "content"}}
<section class="card narrow">
  <h1>New project</h1>
  <p class="muted">A project is one app or service. Each gets its own DSN.</p>
  {{with .Data.Error}}<p class="alert error">{{.}}</p>{{end}}
  <form method="post" action="/projects/new" class="stack">
    <input type="hidden" name="csrf" value="{{.Session.CSRF}}">
    <label>Name <input name="name" required maxlength="100" placeholder="my-web-app" autofocus></label>
    <label>Platform
      <select name="platform">
        {{range .Data.Platforms}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
      </select>
    </label>
    <button class="primary">Create project</button>
  </form>
</section>
{{end}}
