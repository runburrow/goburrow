{{define "content"}}
<section class="auth-card">
  <span class="auth-fox" aria-hidden="true">{{template "fox-peek" .}}</span>
  <h1>Log in to Burrow</h1>
  {{with .Data.Error}}<p class="alert error" role="alert">{{.}}</p>{{end}}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label for="login-email">Email
      <input id="login-email" type="email" name="email" value="{{.Data.Email}}" required autofocus autocomplete="username" inputmode="email" spellcheck="false">
    </label>
    <label for="login-password">Password
      <input id="login-password" type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="primary auth-submit" type="submit">Log in</button>
  </form>
  <p class="muted small auth-note">No account? Ask a team admin for an invite link.</p>
</section>
{{end}}
